name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Release Please creates its tags with GITHUB_TOKEN, which never starts other
  # workflows, so release-cadence.yml dispatches this workflow on the new tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Audit runner egress
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Require a vX.Y.Z tag
        run: '[[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "run this on a vX.Y.Z tag"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: nowplaying.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Name SBOM for the immutable tag
        run: mv nowplaying.spdx.json "nowplaying-${GITHUB_REF_NAME}.spdx.json"
      - name: Pack immutable artifact
        run: |
          node scripts/pack-source-release.js
          node scripts/check-source-release.js "nowplaying-${GITHUB_REF_NAME}.tar.gz"
          sha256sum "nowplaying-${GITHUB_REF_NAME}.tar.gz" "nowplaying-${GITHUB_REF_NAME}.spdx.json" > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            nowplaying-${{ github.ref_name }}.tar.gz
            nowplaying-${{ github.ref_name }}.spdx.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: verify
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --omit=dev
      - name: Verify isolated Windows launcher packaging
        run: node --test test/windows-bundle-smoke.test.js
      - name: Build installer and portable ZIP
        shell: pwsh
        env:
          NOWPLAYING_CHANNEL: stable
        run: ./scripts/build-windows.ps1
      - name: Check asset names match the tag
        shell: pwsh
        run: |
          foreach ($name in "nowplaying-$env:GITHUB_REF_NAME-windows-x64-setup.exe", "nowplaying-$env:GITHUB_REF_NAME-windows-x64.zip") {
            if (-not (Test-Path "dist/windows/$name")) { throw "missing $name" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-${{ github.ref_name }}
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Audit runner egress
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-${{ github.ref_name }}
      - name: One SHA256SUMS for every asset
        run: |
          sha256sum "nowplaying-${GITHUB_REF_NAME}.tar.gz" "nowplaying-${GITHUB_REF_NAME}.spdx.json" "nowplaying-${GITHUB_REF_NAME}-windows-x64-setup.exe" "nowplaying-${GITHUB_REF_NAME}-windows-x64.zip" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest public-repository build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            nowplaying-${{ github.ref_name }}.tar.gz
            nowplaying-${{ github.ref_name }}-windows-x64-setup.exe
            nowplaying-${{ github.ref_name }}-windows-x64.zip
      - name: Verify draft assets before publishing the stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.js
