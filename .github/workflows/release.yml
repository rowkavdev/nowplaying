name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/*.js src/providers/*.js test/*.js
      - run: npm test
      - run: npm run build
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Pack immutable artifact
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "nowplaying-${GITHUB_REF_NAME}.tar.gz" dist LICENSE README.md package.json
          sha256sum "nowplaying-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            nowplaying-${{ github.ref_name }}.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: nowplaying-${{ github.ref_name }}.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" nowplaying-${GITHUB_REF_NAME}.tar.gz SHA256SUMS --verify-tag --generate-notes --title "nowplaying ${GITHUB_REF_NAME}"
