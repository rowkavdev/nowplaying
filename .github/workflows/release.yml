name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Audit runner egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: node --check src/*.js src/providers/*.js test/*.js
      - run: npm test
      - run: npm run build
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: nowplaying.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Name SBOM for the immutable tag
        run: mv nowplaying.spdx.json "nowplaying-${GITHUB_REF_NAME}.spdx.json"
      - name: Pack immutable artifact
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "nowplaying-${GITHUB_REF_NAME}.tar.gz" dist LICENSE README.md package.json
          sha256sum "nowplaying-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            nowplaying-${{ github.ref_name }}.tar.gz
            nowplaying-${{ github.ref_name }}.spdx.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Audit runner egress
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
      - name: Attest public-repository build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nowplaying-${{ github.ref_name }}.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "nowplaying-${GITHUB_REF_NAME}.tar.gz" "nowplaying-${GITHUB_REF_NAME}.spdx.json" SHA256SUMS --clobber --repo "${GITHUB_REPOSITORY}"
