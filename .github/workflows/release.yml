name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Audit runner egress
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: node --check src/*.js src/providers/*.js test/*.js
      - run: npm test
      - run: npm run build
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@36a5fde73e0fcb1d1e70be9ad66b4724e783bda7 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: nowplaying.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Name SBOM for the immutable tag
        run: mv nowplaying.spdx.json "nowplaying-${GITHUB_REF_NAME}.spdx.json"
      - name: Pack immutable artifact
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "nowplaying-${GITHUB_REF_NAME}.tar.gz" dist LICENSE README.md package.json
          sha256sum "nowplaying-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            nowplaying-${{ github.ref_name }}.tar.gz
            nowplaying-${{ github.ref_name }}.spdx.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Audit runner egress
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
      - name: Attest public-repository build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: nowplaying-${{ github.ref_name }}.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" nowplaying-${GITHUB_REF_NAME}.tar.gz nowplaying-${GITHUB_REF_NAME}.spdx.json SHA256SUMS --clobber --repo "${GITHUB_REPOSITORY}"
