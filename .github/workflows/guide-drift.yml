# Drift gate for the tested-examples guide harness (#142 phase 1).
# Non-blocking until it has a stable week, mirroring the corpus gate's
# promotion shape: then drop continue-on-error and add the job to required checks.
name: guide-drift
on:
  schedule:
    - cron: "43 4 * * *"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/guide-paths.js"
      - "scripts/render-card-examples.js"
      - "test/guide-paths.test.js"
      - "src/providers/**"
      - "src/discord-*.js"
      - "src/card.js"
permissions: {}
jobs:
  guide-paths:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/guide-paths.js run --all
      - run: node scripts/guide-paths.js check-docs
  windows-installer-e2e:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Installer E2E
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/windows-installer-e2e.js "dist/windows/nowplaying-v$version-windows-x64-setup.exe"
