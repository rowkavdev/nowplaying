name: Recover verified release publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag
        required: true
        type: string
      run_id:
        description: Original release.yml workflow run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_TAG: ${{ inputs.tag }}
      RECOVERY_RUN_ID: ${{ inputs.run_id }}
      RECOVERY_ARTIFACTS: release-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify original tag, workflow, builds and provenance step
        run: node scripts/recover-release.js verify
      - name: Download original source artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.tag }}
          path: release-artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download original Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-${{ inputs.tag }}
          path: release-artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify original attestations and publish matching draft assets
        run: node scripts/recover-release.js publish
