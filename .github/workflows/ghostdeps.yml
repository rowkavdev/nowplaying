name: GhostDeps

# Advisory dependency scan as a check run (rowkavdev/ghostdeps action, pinned
# by full SHA). Informational only: continue-on-error keeps it from gating CI
# while the signal proves out, mirroring the upstream dogfood shape.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write # Maintain the opt-in PR report.

concurrency:
  group: ghostdeps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ghostdeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: GhostDeps scan
        continue-on-error: true
        uses: rowkavdev/ghostdeps/packages/action@713a4ee962153cd0bf27929f05d802837025dff7
        with:
          path: "."
          comment: "true"
