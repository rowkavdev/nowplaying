name: Rolling development build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-development-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/windows -File | Where-Object Extension -in '.exe','.zip' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/windows/SHA256SUMS
          }
      - name: Refresh dev tag
        shell: bash
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push --force origin dev
      - name: Replace moving development build assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          git tag -f dev "$GITHUB_SHA"
          git push --force origin dev
          gh release create dev --repo "$GITHUB_REPOSITORY" --prerelease --title "Development build" --notes "Automated development build from main at $GITHUB_SHA. This is newer than the latest release and may be unstable. For the latest supported release, use the version GitHub marks Latest. Assets are unsigned; verify SHA256SUMS before installing." dist/windows/*.exe dist/windows/*.zip dist/windows/SHA256SUMS
