name: Rolling development build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: rolling-development-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/windows -File | Where-Object Extension -in '.exe','.zip' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/windows/SHA256SUMS
          }
      - name: Name this development build
        shell: bash
        run: |
          current=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<<"$current"
          echo "DEV_VERSION=${major}.${minor}.$((patch + 1))-dev+${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Build cumulative development release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isDraft --jq 'select(.isPrerelease == false and .isDraft == false) | .tagName')
          if [[ -z "$stable_tag" ]]; then
            stable_tag=$(git rev-list --max-parents=0 HEAD | tail -1)
            baseline_label="initial commit"
          else
            baseline_label="$stable_tag"
          fi

          git log --reverse --no-merges --pretty=format:'%H%x09%s' "$stable_tag..$GITHUB_SHA" > all-changes.tsv
          : > ranked-changes.tsv
          while IFS=$'\t' read -r sha subject || [[ -n "${sha:-}" ]]; do
            [[ -z "${sha:-}" ]] && continue
            case "$subject" in
              *'BREAKING CHANGE'*|*'!'*:*) rank=0 ;;
              security:*|sec:*) rank=1 ;;
              feat:*|feature:*|update:*) rank=2 ;;
              fix:*) rank=3 ;;
              perf:*) rank=4 ;;
              test:*|docs:*|ci:*|chore:*|build:*) rank=9 ;;
              *) rank=5 ;;
            esac
            # shellcheck disable=SC2016 # awk field references must remain literal.
            stats=$(git show --numstat --format= "$sha" | awk '{a+=$1; d+=$2; f++} END {printf "%012d", a+d+f}')
            pr=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
            key=${pr:-commit-$sha}
            printf '%s\t%s\t%s\t%s\t%s\n' "$rank" "$stats" "$key" "$sha" "$subject" >> ranked-changes.tsv
          done < all-changes.tsv

          total=$(cut -f3 ranked-changes.tsv | sort -u | wc -l | tr -d ' ')
          sort -t$'\t' -k1,1n -k2,2nr ranked-changes.tsv | awk -F '\t' '!seen[$3]++' | head -10 > top-changes.tsv
          {
            # shellcheck disable=SC2016 # Markdown backticks are intentional.
            printf 'Automated development build from main at [`%s`](https://github.com/%s/commit/%s).\n\n' "${GITHUB_SHA:0:7}" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'This is a cumulative test build containing updates and fixes since **%s**. It may be unstable. For the latest supported release, use the version GitHub marks Latest. Assets are unsigned; verify SHA256SUMS before installing.\n\n' "$baseline_label"
            printf "## What's Changed\n\n"
            while IFS=$'\t' read -r rank stats key sha subject; do
              short=${sha:0:7}
              if [[ "$key" == commit-* ]]; then
                # shellcheck disable=SC2016 # Markdown backticks are intentional.
                printf -- '- %s ([`%s`](https://github.com/%s/commit/%s))\n' "$subject" "$short" "$GITHUB_REPOSITORY" "$sha"
              else
                # shellcheck disable=SC2016 # Markdown backticks are intentional.
                printf -- '- %s ([#%s](https://github.com/%s/pull/%s), [`%s`](https://github.com/%s/commit/%s))\n' "$subject" "$key" "$GITHUB_REPOSITORY" "$key" "$short" "$GITHUB_REPOSITORY" "$sha"
              fi
            done < top-changes.tsv
            if (( total > 10 )); then printf '\nShowing 10 of %s changes. See Full Changelog for all changes.\n' "$total"; fi
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$stable_tag" "$GITHUB_SHA"
          } > development-release-notes.md
      # One moving pre-release: the "dev" tag and its release are updated in place
      # on every push to main, so the releases page shows a single development
      # build instead of one per merge. It is never marked Latest.
      - name: Update the development pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f dev "$GITHUB_SHA"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/dev
          title="nowplaying development build ${DEV_VERSION}"
          if gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload dev --repo "$GITHUB_REPOSITORY" --clobber dist/windows/*.exe dist/windows/*.zip dist/windows/SHA256SUMS
            # Drop assets from older builds (file names carry the version).
            keep=$(find dist/windows -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name SHA256SUMS \) -printf '%f\n')
            gh release view dev --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > current-assets.txt
            while IFS= read -r asset; do
              if [[ -n "$asset" ]] && ! grep -qxF "$asset" <<<"$keep"; then
                gh release delete-asset dev "$asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < current-assets.txt
            gh release edit dev --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --title "$title" --notes-file development-release-notes.md
          else
            gh release create dev --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --verify-tag --title "$title" --notes-file development-release-notes.md dist/windows/*.exe dist/windows/*.zip dist/windows/SHA256SUMS
          fi
      # Old scheme: one immutable vX.Y.Z-dev.N pre-release per merge. Remove those
      # (release and tag) only after the moving dev release is confirmed to carry
      # this commit's assets. Stable releases never match the pattern.
      - name: Remove old per-merge development pre-releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=$(gh release view dev --repo "$GITHUB_REPOSITORY" --json isPrerelease,assets,tagName --jq 'select(.isPrerelease) | [.assets[].name | select(endswith(".zip"))] | length')
          [[ "${target:-0}" -ge 1 ]] || { echo "dev release not ready; skipping cleanup"; exit 0; }
          [[ "$(git ls-remote --tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/dev | cut -f1)" == "$GITHUB_SHA" ]] || { echo "dev tag not at this commit; skipping cleanup"; exit 0; }
          gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' > prereleases.txt
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
              echo "Deleting $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done < prereleases.txt
