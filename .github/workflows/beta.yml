name: Rolling development build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-development-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/windows -File | Where-Object Extension -in '.exe','.zip' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/windows/SHA256SUMS
          }
      - name: Choose next patch development version
        shell: bash
        run: |
          current=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<<"$current"
          tag="v${major}.${minor}.$((patch + 1))-dev.${GITHUB_RUN_NUMBER}"
          echo "DEV_TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish immutable development pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$DEV_TAG" "$GITHUB_SHA"
          git push origin "$DEV_TAG"
          gh release create "$DEV_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "nowplaying ${DEV_TAG#v}" --notes "Automated development build from main at $GITHUB_SHA. This is a test build for the next patch and may be unstable. For the latest supported release, use the version GitHub marks Latest. Assets are unsigned; verify SHA256SUMS before installing." dist/windows/*.exe dist/windows/*.zip dist/windows/SHA256SUMS
