name: Dev artifact real-install validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/dev-artifact-validation.yml"
      - "scripts/verify-dev-artifacts.ps1"
permissions:
  contents: read
  attestations: read
jobs:
  real-install:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and exercise moving dev installer and portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-dev-artifacts.ps1
