name: Windows bundle

on:
  pull_request:
    paths:
      - "scripts/windows-*"
      - "scripts/build-windows.ps1"
      - ".github/workflows/windows.yml"
      - "package*.json"
      - "src/windows-*"
      - "src/setup-*"
      - "test/windows-*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --omit=dev
      - name: Build and smoke-test EXE bundle
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Credential Manager round-trip
        run: node --test test/windows-credential-adapter.test.js
      - name: Native setup window self-test
        run: node --test test/windows-setup-ui.test.js
      - name: Start from the setup config (Credential Manager round trip)
        run: node --test test/windows-start-config.test.js
      - name: Discord IPC over a named pipe
        run: node --test test/discord-ipc.test.js
      - name: Attest published Windows bundles
        if: ${{ github.event_name == 'release' && github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/windows/*.exe
            dist/windows/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nowplaying-windows-x64
          path: dist/windows/*.zip
          if-no-files-found: error
          retention-days: 14
