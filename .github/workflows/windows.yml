name: Windows bundle

on:
  pull_request:
    paths:
      - "scripts/windows-*"
      - "scripts/build-windows.ps1"
      - ".github/workflows/windows.yml"
      - "package*.json"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Build and smoke-test EXE bundle
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nowplaying-windows-x64
          path: dist/windows/*.zip
          if-no-files-found: error
          retention-days: 14
