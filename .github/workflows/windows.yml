name: Windows bundle

on:
  pull_request:
    paths:
      - "scripts/windows-*"
      - "scripts/build-windows.ps1"
      - ".github/workflows/windows.yml"
      - "package*.json"
      - "src/windows-*"
      - "src/setup-*"
      - "test/windows-*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --omit=dev
      - name: Build and smoke-test EXE bundle
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Credential Manager round-trip
        run: node --test test/windows-credential-adapter.test.js
      - name: Native setup window self-test
        run: node --test test/windows-setup-ui.test.js
      - name: Start from the setup config (Credential Manager round trip)
        run: node --test test/windows-start-config.test.js
      - name: Discord IPC over a named pipe
        run: node --test test/discord-ipc.test.js
      - name: Start with Windows shortcut (write, read back, remove)
        run: node --test test/windows-startup.test.js
      - name: Tray menu self-test
        run: node --test test/windows-tray.test.js
      - name: Attest published Windows bundles
        if: ${{ github.event_name == 'release' && github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/windows/*.exe
            dist/windows/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nowplaying-windows-x64
          path: dist/windows/*.zip
          if-no-files-found: error
          retention-days: 14
