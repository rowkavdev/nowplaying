name: Pull request labels
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
      - name: Apply size label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = ['size:XS','size:S','size:M','size:L','size:XL'];
            const colors = ['0e8a16','1d76db','fbca04','d93f0b','b60205'];
            for (let i = 0; i < labels.length; i++) {
              try { await github.rest.issues.getLabel({owner: context.repo.owner, repo: context.repo.repo, name: labels[i]}); }
              catch { await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, name: labels[i], color: colors[i]}); }
            }
            const pr = context.payload.pull_request;
            const lines = pr.additions + pr.deletions;
            const size = lines <= 10 ? labels[0] : lines <= 50 ? labels[1] : lines <= 200 ? labels[2] : lines <= 500 ? labels[3] : labels[4];
            const current = (await github.rest.issues.listLabelsOnIssue({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number})).data.map(x => x.name);
            for (const name of current.filter(x => labels.includes(x) && x !== size)) await github.rest.issues.removeLabel({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, name});
            if (!current.includes(size)) await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, labels: [size]});
