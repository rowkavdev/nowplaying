<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NowPlaying for YouTube</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>NowPlaying for YouTube</h1>
    <p>Paste the pairing code from the NowPlaying settings page. The extension only sends what's playing on YouTube to NowPlaying on this PC, and only while it's playing. It never sends your history, searches or anything else.</p>
    <form id="pair">
      <label for="token">Pairing code</label>
      <input id="token" name="token" autocomplete="off" spellcheck="false" required minlength="32">
      <label for="port">NowPlaying port</label>
      <input id="port" name="port" inputmode="numeric" pattern="[0-9]{2,5}" value="47832">
      <button type="submit">Save</button>
      <button type="button" id="forget">Unpair</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
